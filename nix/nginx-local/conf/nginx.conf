daemon off;
pid        ./nginx.pid;

events {}

http {
    access_log /dev/stdout;
    error_log /dev/stderr debug;

    server {
        listen 8080;

        location /delay {
            default_type text/plain;
            return 200 'hello world';
        }

        # Other locations and configurations...
    }
}

stream {
    error_log /dev/stderr debug;

    server {
        listen 12345;

        # Introduce a delay after the TCP handshake
        post_handshake_delay 1500ms;

        proxy_pass 127.0.0.1:8080;
    }
}
